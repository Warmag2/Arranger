name: arranger-dev

services:
  arrangerpostgres-dev:
    container_name: arrangerpostgres-dev
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: "${ARRANGER_USER:?err}"
      POSTGRES_PASSWORD: "${ARRANGER_PASSWORD:?err}"
      POSTGRES_DB: arranger
    ports:
      - "5432:5432"
    volumes:
      - arrangerpostgres-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d arranger"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  arrangerpostgres-dev:
