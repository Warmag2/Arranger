services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: arranger
      POSTGRES_PASSWORD: arranger
      POSTGRES_DB: arranger
    ports:
      - "5432:5432"
    volumes:
      - arranger-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arranger"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  arranger-postgres:
